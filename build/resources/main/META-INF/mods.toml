[[dependencies.c2me_base]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.c2me_base]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

# ---------------------------------------------------------------------------
# 内嵌的 MixinExtras（shadow 重定位为 com.ishland.c2me.shaded.mixinextras）
# Forge 的契约：jar 内通过 @Mod 构造出的每个 mod 都必须在本文件中声明，
# 否则报「mods.toml missing metadata for modid mixinextras /
#        constructed 2 mods: [BROKEN, c2me_base], but had 1 mods specified」
# 元数据取自 MixinExtras-forge 自带的 mods.toml（MIT，见 THIRD-PARTY.md）
# ---------------------------------------------------------------------------
[[mods]]
modId="mixinextras"
version="0.3.6"
displayName="MixinExtras (bundled)"
displayTest="IGNORE_SERVER_VERSION"
authors="LlamaLad7"
description='''
MixinExtras, bundled and relocated by c2me-base for Forge 1.20.1.
Upstream: https://github.com/LlamaLad7/MixinExtras (MIT License)
'''

[[dependencies.mixinextras]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"
